services:
  db:
    image: postgres:16-alpine
    container_name: vigil-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vigil          # owner role: runs migrations
      POSTGRES_PASSWORD: vigil
      POSTGRES_DB: vigil
    ports:
      - "5432:5432"
    volumes:
      - vigil-pgdata:/var/lib/postgresql/data
      # Runs once, on first start of an empty volume: creates the
      # restricted app role and the vigil_test database.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vigil -d vigil"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  vigil-pgdata:
